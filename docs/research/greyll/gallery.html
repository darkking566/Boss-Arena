<!doctype html><meta charset=utf-8><title>Greyll 圖鑑</title><style>body{background:#12171c;color:#ddd;font:14px sans-serif;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;padding:12px}img{width:100%}figure{margin:0}</style><figure><img src="images/gr-ref-001.jpg" loading="lazy"><figcaption><b>gr-ref-001</b> [設計稿] 官方設定稿（Agheel；Eldenpedia 稱 Greyll 外觀與 Agheel 相同）：側面全身灰黑龍，頭有單角、背脊與翼緣鋸齒羽狀鱗；下方有俯視翼展、站姿、前傾姿勢草圖</figcaption></figure><figure><img src="images/gr-ref-002.jpg" loading="lazy"><figcaption><b>gr-ref-002</b> [家族參考] 官方畫作：Lansseax（古龍），銀白身軀、金褐羽狀翼膜——只用來對照「龍的翼膜質感」，不是 Greyll</figcaption></figure><figure><img src="images/gr-ref-003.jpg" loading="lazy"><figcaption><b>gr-ref-003</b> [家族參考] 官方畫作：Adula（輝石龍），黑身藍晶——龍族系列對照，不是 Greyll</figcaption></figure><figure><img src="images/gr-ref-005.png" loading="lazy"><figcaption><b>gr-ref-005</b> [外觀] 龍頭近照（來源頁標為 Greyoll 圖示）：灰色鱗、紅眼、張口，下方有紅光；是 Greyll 或 Elder Greyoll 未核實，只當龍頭質感</figcaption></figure><figure><img src="images/gr-ref-008.png" loading="lazy"><figcaption><b>gr-ref-008</b> [外觀] 霧中正面：雙翼向兩側張開、頭有尖角、腳邊有白光點，灰褐近黑的羽鱗</figcaption></figure><figure><img src="images/gr-ref-009.jpg" loading="lazy"><figcaption><b>gr-ref-009</b> [場景] 擊倒後掉落龍心（Dragon Heart），雨天石板橋面，右側有石欄與枯樹</figcaption></figure><figure><img src="images/gr-ref-010.jpg" loading="lazy"><figcaption><b>gr-ref-010</b> [招式] 貼近看龍腿：粗壯鱗腿與翼緣羽刺佔滿畫面——打腳的角度</figcaption></figure><figure><img src="images/gr-ref-011.jpg" loading="lazy"><figcaption><b>gr-ref-011</b> [招式] 龍起身展翼、玩家騎馬在前（升空前兆）</figcaption></figure><figure><img src="images/gr-ref-012.jpg" loading="lazy"><figcaption><b>gr-ref-012</b> [招式] 架勢被打崩：頭低垂貼地，口邊噴出橘色火星</figcaption></figure><figure><img src="images/gr-ref-013.jpg" loading="lazy"><figcaption><b>gr-ref-013</b> [招式] 轉姿後噴出火焰，火在橋面右側；背後黃金樹</figcaption></figure><figure><img src="images/gr-ref-014.jpg" loading="lazy"><figcaption><b>gr-ref-014</b> [場景] 橋面遠景：圓形紋章地面、石欄、遠處的 Greyll，背景黃金樹</figcaption></figure><figure><img src="images/gr-ref-016.jpg" loading="lazy"><fi
