<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astel（黑暗棄子）圖鑑</title><style>body{background:#12151c;color:#dde;font:14px sans-serif;margin:16px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}figure{margin:0;background:#1b2030;padding:8px;border-radius:6px}img{width:100%;display:block}figcaption{margin-top:6px;font-size:12px}a{color:#9cf}</style><h1>Astel（黑暗棄子）圖鑑（40 張）</h1><p><a href="IMAGE-INDEX.md">逐圖來源</a>・<a href="RESEARCH-LOG.md">研究範圍與缺口</a></p><div class="g"><figure><a href="images/as-ref-001.jpg"><img loading="lazy" src="images/as-ref-001.jpg"></a><figcaption><b>as-ref-001・招式</b><br>宇宙光束起手：頭頂拉出橫向紫色光束與爆裂星芒，背後雙翼與一串彩色星屑球，彎鉗朝兩側張開</figcaption></figure><figure><a href="images/as-ref-002.jpg"><img loading="lazy" src="images/as-ref-002.jpg"></a><figcaption><b>as-ref-002・場景</b><br>腐敗之湖的棺材通道：紅色瀑布與燭台，是通往 Astel 迷霧門的路</figcaption></figure><figure><a href="images/as-ref-003.jpg"><img loading="lazy" src="images/as-ref-003.jpg"></a><figcaption><b>as-ref-003・外觀</b><br>低伏全身：六肢像蜘蛛般撐開、扁平黑色彎鉗貼地、雙翼收在背後；場地是漆黑平坦的水面</figcaption></figure><figure><a href="images/as-ref-004.jpg"><img loading="lazy" src="images/as-ref-004.jpg"></a><figcaption><b>as-ref-004・招式</b><br>藍色半透明氣團連同橘色小球包住玩家（招式名未核實，應是星屑氣爆之類）</figcaption></figure><figure><a href="images/as-ref-005.jpg"><img loading="lazy" src="images/as-ref-005.jpg"></a><figcaption><b>as-ref-005・外觀</b><br>正面：骷髏頭、兩側彎鉗、頸後一圈毛、雙翼向左右展開，頭頂有紫色橫光</figcaption></figure><figure><a href="images/as-ref-006.jpg"><img loading="lazy" src="images/as-ref-006.jpg"></a><figcaption><b>as-ref-006・招式</b><br>黑色球核周圍捲出紫色弧光，像小型黑洞（招式名未核實）</figcaption></figure><figure><a href="images/as-ref-007.jpg"><img loading="lazy" src="images/as-ref-007.jpg"></a><figcaption><b>as-ref-007・場景</b><br>「傳說擊倒」畫面與黑暗星塵散開，獲得 Remembrance of the Naturalborn</figcaption></figure><figure><a href="images/as-ref-009.jpg"><img loading="lazy" src="images/as-ref-009.jpg"></a><figcaption><b>as-ref-009・外觀</b><br>由下往上看：顱骨、彎鉗、大片雙翼與星球串；玩家在腳邊，紫白火花</figcaption></figure><figure><a href="images/as-ref-010.jpg"><img loading="lazy" src="images/as-ref-010.jpg"></a><figcaption><b>as-ref-010・場景</b><br>腐敗之湖：紅霧、枯樹與菇群，通往 Astel 的前一區</figcaption></figure><figure><a href="images/as-ref-015.png"><img loading="lazy" src="images/as-ref-015.png"></a><figcaption><b>as-ref-015・外觀</b><br>官方標題卡（Naturalborn）：低伏、黑色彎鉗、背後有月牙形光環</figcaption></figure><figure><a href="images/as-ref-016.png"><img loading="lazy" src="images/as-ref-016.png"></a><figcaption><b>as-ref-016・外觀</b><br>同畫面無字版：貼近水面的低伏姿態，水面倒影與月牙光環</figcaption></figure><figure><a href="images/as-ref-018.gif"><img loading="lazy" src="images/as-ref-018.gif"></a><figcaption><b>as-ref-018・招式</b><br>玩家揮劍時，Astel 上方炸出紫色星爆</figcaption></figure><figure><a href="images/as-ref-019.gif"><img loading="lazy" src="images/as-ref-019.gif"></a><figcaption><b>as-ref-019・外觀</b><br>（GIF 第一格）遠景全身：六肢撐地、彎鉗成環、雙翼背在身後</figcaption></figure><figure><a href="images/as-ref-020.gif"><img loading="lazy" src="images/as-ref-020.gif"></a><figcaption><b>as-ref-020・外觀</b><br>（GIF 第一格）懸浮遠景：翼展開、上方一串星球</figcaption></figure><figure><a href="images/as-ref-021.gif"><img loading="lazy" src="images/as-ref-021.gif"></a><figcaption><b>as-ref-021・外觀</b><br>（GIF 第一格）中景：彎鉗圍成圓環、月環與翼膜</figcaption></figure><figure><a href="images/as-ref-022.gif"><img loading="lazy" src="images/as-ref-022.gif"></a><figcaption><b>as-ref-022・招式</b><br>（GIF 第一格）紫色花狀光團在遠處升起，地面有玩家火光（招式未核實）</figcaption></figure><figure><a href="images/as-ref-023.gif"><img loading="lazy" src="images/as-ref-023.gif"></a><figcaption><b>as-ref-023・外觀</b><br>（GIF 第一格）薄霧裡的 Astel，翼半透明，上方紫色星雲</figcaption></figure><figure><a href="images/as-ref-024.gif"><img loading="lazy" src="images/as-ref-024.gif"></a><figcaption><b>as-ref-024・外觀</b><br>（GIF 第一格）近距：獨眼發光的顱骨、彎鉗、右側細長手臂</figcaption></figure><figure><a href="images/as-ref-025.gif"><img loading="lazy" src="images/as-ref-025.gif"></a><figcaption><b>as-ref-025・外觀</b><br>（GIF 第一格）仰視：翼膜與垂下的星球串，玩家劍氣掃過</figcaption></figure><figure><a href="images/as-ref-026.gif"><img loading="lazy" src="images/as-ref-026.gif"></a><figcaption><b>as-ref-026・招式</b><br>（GIF 第一格）Astel 飛起，右側一顆紫色能量球射向玩家</figcaption></figure><figure><a href="images/as-ref-027.gif"><img loading="lazy" src="images/as-ref-027.gif"></a><figcaption><b>as-ref-027・招式</b><br>（GIF 第一格）側面：長臂撐地，尾端拍擊水面濺起白浪</figcaption></figure><figure><a href="images/as-ref-028.gif"><img loading="lazy" src="images/as-ref-028.gif"></a><figcaption><b>as-ref-028・招式</b><br>（GIF 第一格）遠方升起紫色環形光陣（可能是瞬移或隕石前兆，未核實）</figcaption></figure><figure><a href="images/as-ref-029.gif"><img loading="lazy" src="images/as-ref-029.gif"></a><figcaption><b>as-ref-029・外觀</b><br>（GIF 第一格）遠景：翼展開，玩家劍氣在前</figcaption></figure><figure><a href="images/as-ref-030.png"><img loading="lazy" src="images/as-ref-030.png"></a><figcaption><b>as-ref-030・外觀</b><br>官方標題卡（Stars of Darkness）：灰霧洞窟中同樣的低伏姿態與黑色環形彎鉗</figcaption></figure><figure><a href="images/as-ref-031.png"><img loading="lazy" src="images/as-ref-031.png"></a><figcaption><b>as-ref-031・外觀</b><br>Stars of Darkness 洞窟畫面：灰褐色地面，彎鉗環與月環</figcaption></figure><figure><a href="images/as-ref-043.jpg"><img loading="lazy" src="images/as-ref-043.jpg"></a><figcaption><b>as-ref-043・場景</b><br>掉落 Remembrance of the Naturalborn，背景是星空與水面</figcaption></figure><figure><a href="images/as-ref-044.jpg"><img loading="lazy" src="images/as-ref-044.jpg"></a><figcaption><b>as-ref-044・場景</b><br>Stars of Darkness 掉落 Meteorite of Astel（120,000 盧恩），洞窟霧中</figcaption></figure><figure><a href="images/as-ref-045.jpg"><img loading="lazy" src="images/as-ref-045.jpg"></a><figcaption><b>as-ref-045・招式</b><br>紫色光柱由上垂直打下，碎石與星屑懸浮空中；光束招的主參考</figcaption></figure><figure><a href="images/as-ref-046.jpg"><img loading="lazy" src="images/as-ref-046.jpg"></a><figcaption><b>as-ref-046・招式</b><br>三條手臂尖端各聚一顆紫色球：黑暗波前兆</figcaption></figure><figure><a href="images/as-ref-047.jpg"><img loading="lazy" src="images/as-ref-047.jpg"></a><figcaption><b>as-ref-047・招式</b><br>巨大圓形星空光陣，內有星點與爆光、外圈多層光環，旁邊藍色冰晶狀碎光</figcaption></figure><figure><a href="images/as-ref-048.jpg"><img loading="lazy" src="images/as-ref-048.jpg"></a><figcaption><b>as-ref-048・招式</b><br>粉紫色爆炸衝擊波橫掃畫面，Astel 在後方</figcaption></figure><figure><a href="images/as-ref-049.jpg"><img loading="lazy" src="images/as-ref-049.jpg"></a><figcaption><b>as-ref-049・外觀</b><br>貼近頭部：頸毛與顱骨下方，玩家在頭下方，橘色火花</figcaption></figure><figure><a href="images/as-ref-050.jpg"><img loading="lazy" src="images/as-ref-050.jpg"></a><figcaption><b>as-ref-050・招式</b><br>眼窩亮起藍光，頭前低垂（依 Fextralife，眼發光是壓碎咬的前兆）</figcaption></figure><figure><a href="images/as-ref-051.jpg"><img loading="lazy" src="images/as-ref-051.jpg"></a><figcaption><b>as-ref-051・招式</b><br>四顆紫色球體懸在手臂末端：大範圍黑暗波前兆（本圖看到四顆，不能證明總數）</figcaption></figure><figure><a href="images/as-ref-052.jpg"><img loading="lazy" src="images/as-ref-052.jpg"></a><figcaption><b>as-ref-052・招式</b><br>紫白多層圓環波貼著水面向外擴散：黑暗波衝擊</figcaption></figure><figure><a href="images/as-ref-053.jpg"><img loading="lazy" src="images/as-ref-053.jpg"></a><figcaption><b>as-ref-053・招式</b><br>白紫色巨浪夾著碎石吞沒畫面：大型衝擊波</figcaption></figure><figure><a href="images/as-ref-054.jpg"><img loading="lazy" src="images/as-ref-054.jpg"></a><figcaption><b>as-ref-054・場景</b><br>遠景全貌：藍色翼展、紫色星雲遍佈天空，玩家站在水面</figcaption></figure><figure><a href="images/as-ref-055.jpg"><img loading="lazy" src="images/as-ref-055.jpg"></a><figcaption><b>as-ref-055・招式</b><br>大型紫色球核與環形光圈在身前展開，Astel 在後方</figcaption></figure><figure><a href="images/as-ref-056.png"><img loading="lazy" src="images/as-ref-056.png"></a><figcaption><b>as-ref-056・外觀</b><br>顱骨特寫：左側有裂縫、藍眼發光、頸後毛、兩側彎鉗，附近星球串</figcaption></figure><figure><a href="images/as-ref-058.jpg"><img loading="lazy" src="images/as-ref-058.jpg"></a><figcaption><b>as-ref-058・官方畫作</b><br>Creative Uncut 收錄的官方美術（1000×1160）：兩對蜻蜓狀翅膀、頭骨帶藍眼、脖後白毛、細長骨臂、爪手、彎鉗，身後一串彩色星球與行星環；比遊戲畫面更清楚。不是概念草圖，畫師與出處畫冊未核實</figcaption></figure></div>
